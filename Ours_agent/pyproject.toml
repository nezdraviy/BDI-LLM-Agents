[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ours-agent-runtime"
version = "0.1.0"
description = "Domain-independent agent runtime with goals, plans and intentions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
first-data-agent = "first_agent.cli:main"

[tool.setuptools]
packages = ["agent_runtime", "first_agent", "data_tools"]
py-modules = ["data_validation_profile"]

[tool.setuptools.package-dir]
data_tools = "participant4-tools/data_tools"
